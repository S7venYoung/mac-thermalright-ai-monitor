name: Build macOS ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main\n      - agent/apple-watch-theme
    paths:
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libusb pkg-config

      - name: Show build environment
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Build release
        run: swift build -c release

      - name: Package application
        run: |
          bin_dir="$(swift build -c release --show-bin-path)"
          app_dir="$PWD/dist/MacTR.app"
          executable="$app_dir/Contents/MacOS/MacTR"
          frameworks_dir="$app_dir/Contents/Frameworks"

          mkdir -p "$app_dir/Contents/MacOS" "$frameworks_dir" \
            "$app_dir/Contents/Resources"
          cp Sources/MacTR/Resources/Info.plist "$app_dir/Contents/Info.plist"
          cp "$bin_dir/MacTR" "$executable"
          chmod +x "$executable"

          cp Sources/MacTR/Resources/AppIcon.icns \
            "$app_dir/Contents/Resources/AppIcon.icns"

          test -d "$bin_dir/Sparkle.framework"
          cp -R "$bin_dir/Sparkle.framework" "$frameworks_dir/"

          sparkle_dependency="$(otool -L "$executable" \
            | awk '/Sparkle.framework/{print $1; exit}')"
          test -n "$sparkle_dependency"
          install_name_tool -change "$sparkle_dependency" \
            "@executable_path/../Frameworks/Sparkle.framework/Versions/B/Sparkle" \
            "$executable"

          libusb_dependency="$(otool -L "$executable" | awk '/libusb/{print $1; exit}')"
          test -n "$libusb_dependency"
          libusb_name="$(basename "$libusb_dependency")"
          cp -L "$libusb_dependency" "$frameworks_dir/$libusb_name"
          install_name_tool -change "$libusb_dependency" \
            "@executable_path/../Frameworks/$libusb_name" "$executable"

          if ! otool -l "$executable" \
            | grep -Fq '@executable_path/../Frameworks'; then
            install_name_tool -add_rpath \
              "@executable_path/../Frameworks" "$executable"
          fi

          codesign --force --deep --sign - "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
          plutil -lint "$app_dir/Contents/Info.plist"
          otool -L "$executable"

          "$executable" --snapshot "$PWD/dist/smoke-test.png" --cores 10
          test -s "$PWD/dist/smoke-test.png"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir" MacTR-macos-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTR-macos-arm64
          path: MacTR-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
