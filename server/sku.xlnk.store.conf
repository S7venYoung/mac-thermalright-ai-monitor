server {
    server_name sku.xlnk.store;

    client_max_body_size 4m;

    location = /api/jd/stats {
        proxy_pass http://127.0.0.1:18732/api/jd/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sku.xlnk.store/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sku.xlnk.store/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sku.xlnk.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sku.xlnk.store;
    return 404; # managed by Certbot


}
